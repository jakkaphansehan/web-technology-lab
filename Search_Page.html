<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="uni-name">มหาวิทยาลัยแม่โจ้ <small>MAEJO UNIVERSITY</small></span>
            </div>
            <div class="system-title">
                <span>ระบบบริการการศึกษา</span>
            </div>
        </div>
    </header>

    <div class="main-wrapper container">
        
        <nav class="site-sidebar">
            <div class="menu-header">เมนูหลัก</div>
            <ul class="menu-list">
                <li><a href="index.html" class="active">หน้าแรก</a></li>
                <li><a href="Search_Page.html">ค้นหารายวิชา</a></li>
                <li><a href="#">ตารางเรียนนิสิต</a></li>
                <li><a href="#">ตารางสอบกลางภาค</a></li>
                <li><a href="Register_guide.html">ขั้นตอนการลงทะเบียน</a></li>
            </ul>
        </nav>

        <main class="site-content">
            <section class="search-section">
                <h2>ค้นหารายวิชา</h2>
                
                <form class="search-form-grid">
                    <div class="form-group">
                        <label>ขั้นที่ 1 หมวดวิชา :</label>
                        <select>
                            <option>รหัสวิชาที่ยังใช้อยู่</option>
                            <option>รหัสวิชาที่ยกเลิกใช้แล้ว</option>
                            <option>ทั้งหมด</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 2 หน่วยงานเจ้าของรายวิชา :</label>
                        <select>
                            <option>ทั้งหมด</option>
                            <option>คณะวิทยาศาสตร์</option>
                            <option>คณะวิศวกรรมและอุตสาหกรรมเกษตร</option>
                            <option>คณะศิลปศาสตร์</option>
                            <option>คณะพยาบาลศาสตร์</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 3 จำนวนรายการที่แสดง :</label>
                        <select>
                            <option>25</option>
                            <option>50</option>
                            <option>100</option>
                            <option>250</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 4 ปีการศึกษา :</label>
                        <div class="inline-inputs">
                            <select><option>2569</option></select>
                            <select>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                            </select>
                        </div>
                    </div>
                </form>
                <form action="Search_Page(2).html" method="GET" class="search-form-grid">
                        <div class="form-group full-width">
                            <label>ขั้นที่ 5 ป้อนข้อความในช่องรหัสวิชา/ชื่อวิชา :</label>
                            <div class="search-action-row">
                                <input type="text" placeholder="รหัสวิชา หรือ ชื่อวิชา">
                                <button type="submit" class="btn-search">ค้นหา</button>
                            </div>
                        </div>
                    </form>
            </section>
        </main>

    </div>
</body>
</html>

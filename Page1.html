<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหารายวิชา - ระบบบริการการศึกษา มจอ.</title>
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="uni-name">มหาวิทยาลัยแม่โจ้ <small>MAEJO UNIVERSITY</small></span>
            </div>
        </div>
    </header>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container container">
            <ul class="menu-list">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="Page1.html" class="active">ค้นหารายวิชา</a></li>
                <li><a href="Page2.html">วิชาหลักสูตร</a></li>
                <li><a href="#">ตารางการใช้ห้อง</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper container">
        <main class="site-content">
            <section class="search-section">
                <h2>ค้นหารายวิชา</h2>
                
                <form class="search-form-grid">
                    <div class="form-group">
                        <label>ขั้นที่ 1 หมวดวิชา :</label>
                        <select>
                            <option>รหัสวิชาที่ยังใช้อยู่</option>
                            <option>รหัสวิชาที่ยกเลิกใช้แล้ว</option>
                            <option>ทั้งหมด</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 2 หน่วยงานเจ้าของรายวิชา :</label>
                        <select>
                            <option>ทั้งหมด</option>
                            <option>คณะวิทยาศาสตร์</option>
                            <option>คณะวิศวกรรมและอุตสาหกรรมเกษตร</option>
                            <option>คณะศิลปศาสตร์</option>
                            <option>คณะพยาบาลศาสตร์</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 3 จำนวนรายการที่แสดง :</label>
                        <select>
                            <option>25</option>
                            <option>50</option>
                            <option>100</option>
                            <option>250</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ขั้นที่ 4 ปีการศึกษา :</label>
                        <div class="inline-inputs">
                            <select><option>2569</option></select>
                            <select>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>ขั้นที่ 5 ป้อนข้อความในช่องรหัสวิชา/ชื่อวิชา :</label>
                        <div class="search-action-row">
                            <input type="text" placeholder="รหัสวิชา หรือ ชื่อวิชา">
                            <!-- จำลองปุ่มเพื่อให้กดไปหน้าผลลัพธ์ได้ -->
                            <button type="button" class="btn-search" onclick="window.location.href='Page2.html'">ค้นหา</button>
                        </div>
                    </div>
                </form>

            </section>
        </main>
    </div>

</body>
</html>
